lock;width:16px;height:16px;position:absolute;left:3px;top:3px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px #0002;transition:transform 120ms}.preference-switch:checked{background:var(--accent)}.preference-switch:checked:before{transform:translateX(14px)}.utility-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:14px 22px 18px;background:var(--paper);font-size:11px;color:var(--muted)}.utility-footer .reset-preferences{font-size:12px;color:var(--accent)}.utility-footer [data-preference-status]{margin-left:auto;line-height:1.7}.about-identity{display:flex;align-items:center;gap:16px;padding:28px 0 20px}.about-identity .mark{width:35px;height:42px}.about-identity h3{font:600 28px var(--serif);margin-bottom:6px}.about-identity p{font-size:12px;margin:0;color:var(--muted)}.utility-content .about-intro{font-size:15px;line-height:1.9;margin:0 0 22px}.about-capabilities{margin:0 0 24px}.about-capabilities>div{display:flex;gap:24px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.about-capabilities dt{color:var(--accent);flex:none}.about-capabilities dd{margin:0;color:var(--muted)}.about-preview{padding:18px 0 16px}.about-preview h3{font-size:12px;margin-bottom:10px}.about-preview h3 span{font-weight:400;font-size:11px;color:var(--muted);margin-left:8px}.about-preview p{font-size:12px;line-height:1.85;color:var(--muted);margin-bottom:0}.project-link{display:inline-flex;gap:8px;align-items:center;padding:6px;color:var(--accent);font-size:12px;text-decoration:none}.project-link:hover{text-decoration:underline}

<script>
const icons={settings:'<path d="M3 2v12M8 2v12M13 2v12M1 5h4M6 11h4M11 6h4"/>',info:'<circle cx="8" cy="8" r="6"/><path d="M8 7v4m0-7v1"/>',search:'<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 4 4"/>',back:'<path d="m10 3-6 5 6 5"/>',edit:'<path d="m3 11 8-8 3 3-8 8H3z"/>',plus:'<path d="M8 2v12M2 8h12"/>'};
const icon=name=>`<svg viewBox="0 0 16 16" aria-hidden="true">${icons[name]||icons.plus}</svg>`;
const esc=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items={
 letter:{type:'情节',group:'雨夜来信',status:'准备采用',title:'雨夜来信',summary:'失踪多年的旧友送来一封没有落款的信。地址指向一间早已封门的书铺。',body:'雨声把敲门声压得很低。主角拿到信时，送信人已经离开，只在门槛上留下一串泥水脚印。\n\n## 这场戏的变化\n此前，他以为旧友已经死去。信中一个只有两人知道的称呼，让他第一次开始怀疑。这个疑问推动他离开熟悉的生活。\n\n## 还需要讨论\n信中的地址是真的邀约，还是有人故意引他出门？此处暂不揭晓。让人物先做选择，再逐步看见代价。',links:['follow','confront'],x:42,y:228},
 follow:{type:'情节',group:'雨夜来信',status:'讨论中',title:'暗中跟踪',summary:'暂不拆穿送信人的身份，跟随他的脚印寻找线索。',body:'他决定先弄清楚来信的目的。没有立刻追问，也没有直接赶往信中的地址。\n\n## 推进原因\n主角不相信突然出现的善意，但也无法放弃旧友还活着的可能。跟踪让两种心情同时参与这个决定。\n\n## 可能的后果\n送信人不是幕后主使。他会把主角引向第二封信，也让对方察觉到自己已被关注。',links:['second'],x:356,y:92},
 confront:{type:'情节',group:'雨夜来信',status:'讨论中',title:'当场问清',summary:'追上送信人，直接询问旧友的下落；更快，也更冒险。',body:'这是与暗中跟踪并列的另一种走向。主角可以更主动，但需要付出暴露意图的代价。\n\n## 讨论重点\n此时的人物是否已经具备当场质问的理由？如果没有，这个选择容易显得只是为了让情节变快。\n\n## 尚未确定\n送信人会沉默、撒谎，还是透露一部分真相？先保留分支，等作者决定人物的态度。',links:[],x:356,y:366},
 second:{type:'情节',group:'雨夜来信',status:'讨论中',title:'发现第二封信',summary:'同样的字迹，另一处地址。旧友的线索开始变得矛盾。',body:'第二封信出现时，第一封信仍然没有给出答案。\n\n此处的作用是增加一个有意义的问题：谁在借用旧友的身份？不要仅靠隐瞒所有信息来维持悬念。',links:[],x:680,y:92},
 character:{type:'人物',group:'城中人物',status:'',title:'沈砚',summary:'旧书铺的年轻掌柜。擅长辨认笔迹，却从不愿谈起自己的过去。',body:'沈砚说话很轻，递东西时总把字迹朝向对方。他习惯记住每个人写字的样子，却很少记住他们的名字。\n\n## 他想要什么\n守住书铺，也是守住旧友留下的最后一点生活。他希望事情保持原样，但这封信让沉默开始变得昂贵。\n\n## 与主角的关系\n两人并非一开始就信任彼此。主角相信证据，他相信字里行间的迟疑。讨论剧情时，可以让这两种判断发生冲突。\n\n## 写作时留意\n克制不等于没有情绪。他越是想掩饰，越容易在无关紧要的小事上露出坚持。',links:['world']},
 world:{type:'世界设定',group:'地点与风俗',status:'',title:'南街旧书铺',summary:'城南一间不挂招牌的旧书铺。天黑后仍亮着灯，熟客都知道从侧门进去。',body:'书铺临着一条窄巷。正门常年半掩，窗沿堆着晒不干的旧纸。雨天进门的人，会先闻到木头和墨的味道。\n\n## 空间与行动\n前堂是书架与柜台，后院只有一间存书的小屋。侧门通向河岸，既方便送货，也让陌生人的来去不那么显眼。\n\n## 可以影响情节的细节\n掌柜能从纸张的产地判断一封信走过的路。这里适合作为线索交汇的地点，但它的作用取决于人物怎样使用它。',links:['character']}
};
items.oldfriend={type:'人物',group:'城中人物',status:'',title:'失踪旧友',summary:'七年前离开南街，从此音讯全无。信中的称呼却来自两人的旧约。',body:'他离开时没有解释原因，只把书铺的钥匙交给沈砚。\n\n这次来信究竟出自他本人，还是有人借用了他的身份，仍需在情节推进中查明。',links:[]};
items.street={type:'世界设定',group:'地点与风俗',status:'',title:'南街',summary:'沿河展开的一条旧街。书铺、渡口和熟人的消息在这里交汇。',body:'入夜以后，沿河的店铺陆续关门。旧书铺却常常亮着灯。\n\n街道与渡口之间有几条小巷，可以走人，也藏得住来去的脚步。',links:[]};
const memoryRelations=[
 {id:'manages',from:'character',to:'world',name:'经营',content:''},
 {id:'seeks',from:'character',to:'oldfriend',name:'寻找',content:'七年未见，仍在等一个解释。'},
 {id:'unlabelled',from:'world',to:'street',name:'',content:''},
 {id:'clue',from:'oldfriend',to:'world',name:'',content:'曾将书铺的钥匙留给沈砚。'}
];
const volumes=[{id:'volume-one',title:'第一卷 · 雨夜来信'},{id:'volume-two',title:'第二卷 · 长街旧事'}];
const chapters=[
 {id:'chapter-one',volumeId:'volume-one',title:'第一章 雨夜来信',body:'　　雨声把敲门声压得很低。沈砚搁下笔，等了一会儿，门外又响了两下。\n\n　　门口站着个陌生少年，斗笠边沿还在滴水。他从怀里取出一封信，压在柜台上。\n\n　　“有人让我送给你。”\n\n　　沈砚没有接。他先看见纸角一小片晕开的墨，然后才看见那个称呼。已经有七年，没有人这样叫过他了。\n\n　　等他再抬头，少年已经走了。门槛上的水迹向巷口延伸，被新落下的雨一点点擦去。'},
 {id:'chapter-two',volumeId:'volume-one',title:'第二章 门后的灯',body:'　　灯还亮着。沈砚把信放在桌上，慢慢展开。\n\n　　纸上没有落款，只有一行熟悉的字：明日天黑以后，来南街。'},
 {id:'chapter-three',volumeId:'volume-two',title:'第三章 河岸',body:''}
];
const groups={plan:['雨夜来信'],memory:['城中人物','地点与风俗']};
const countWords=text=>Array.from(text.replace(/\s/gu,'')).length;
const countLabel=text=>`${countWords(text).toLocaleString('zh-CN')} 字`;
const uid=prefix=>`${prefix}-${++state.sequence}`;
const preferenceDefaults={fontSize:'18',lineHeight:'1.95',directoryOpen:true,planningView:'graph',settingsView:'list',motion:'system'};
const preferenceChoices={fontSize:['16','18','20','22'],lineHeight:['1.75','1.95','2.2'],planningView:['graph','list'],settingsView:['list','graph'],motion:['system','reduce']};
const preferenceKey='cuigengji:visual-prototype:preferences:v1';
let preferenceStorageAvailable=true;
function loadPreferences(){const result={...preferenceDefaults};try{const stored=JSON.parse(localStorage.getItem(preferenceKey)||'null');if(stored&&typeof stored==='object'){for(const [key,choices] of Object.entries(preferenceChoices))if(choices.includes(stored[key]))result[key]=stored[key];if(typeof stored.directoryOpen==='boolean')result.directoryOpen=stored.directoryOpen;}}catch{preferenceStorageAvailable=false;}return result;}
const preferences=loadPreferences();
function applyPreferences(){document.documentElement.style.setProperty('--prose-size',preferences.fontSize+'px');document.documentElement.style.setProperty('--prose-leading',preferences.lineHeight);document.documentElement.dataset.motion=preferences.motion;setupAutoGrow();}
function savePreferences(){applyPreferences();try{localStorage.setItem(preferenceKey,JSON.stringify(preferences));preferenceStorageAvailable=true;}catch{preferenceStorageAvailable=false;}document.querySelectorAll('[data-preference-status]').forEach(el=>el.textContent=preferenceStorageAvailable?'偏好已保存在此浏览器':'无法保存到浏览器，偏好仅在本次预览有效');}
const state={view:'plan',selected:null,editing:false,search:false,query:'',type:'全部',zoom:1,memoryGraph:preferences.settingsView==='graph',list:preferences.planningView==='list',memoryZoom:1,memoryGroup:'all',group:'雨夜来信',history:false,chapterId:'chapter-one',directoryOpen:preferences.directoryOpen,volumeCollapsed:{},directoryQuery:'',creating:null,sequence:0};
const menu=()=>`<details class="menu"><summary aria-label="更多操作">···</summary><div class="menu-items"><button data-menu="history">修改记录</button></div></details>`;
const textBody=text=>text.split(/\n\n/).map(block=>block.startsWith('## ')?`<h3>${esc(block.slice(3).split('\n')[0])}</h3>${block.includes('\n')?`<p>${esc(block.slice(block.indexOf('\n')+1))}</p>`:''}`:`<p>${esc(block)}</p>`).join('');
function detail(){const item=items[state.selected];if(!item)return'';return `<aside class="detail" aria-label="内容详情"><div class="detailbar"><button class="back" data-action="back">${icon('back')}返回${state.view==='plan'?(state.list?'列表':'流程图'):'设定'}</button><span class="grow"></span>${state.editing?'<button data-action="cancel">取消</button><button class="primary" data-action="save">保存</button>':`<button data-action="edit">${icon('edit')}编辑</button><details class="menu"><summary aria-label="内容操作">···</summary><div class="menu-items"><button data-action="properties">查看属性</button>${state.view==='plan'?'<button data-action="continue">接着推进</button>':''}<button data-menu="history">版本记录</button></div></details>`}</div><div class="detail-scroll"><article class="document"><div class="kicker"><span>${esc(item.type)}</span><span class="dot"></span><span>${esc(item.group)}</span>${item.status?`<span class="dot"></span><span>${esc(item.status)}</span>`:''}</div>${state.editing?`<label class="edit-label" for="edit-title">标题</label><input id="edit-title" value="${esc(item.title)}"><label class="edit-label" for="edit-summary">摘要</label><textarea id="edit-summary" class="edit-summary">${esc(item.summary)}</textarea><label class="edit-label" for="edit-body">全文</label><textarea id="edit-body" class="edit-body">${esc(item.body)}</textarea>`:`<h1 tabindex="-1">${esc(item.title)}</h1>${item.summary?`<p class="dek">${esc(item.summary)}</p>`:''}<div class="document-body">${textBody(item.body)}</div>`}<section class="context-links"><small>${state.view==='plan'?'接下来':'相关设定'}</small>${(state.view==='memory'?relatedMemory(state.selected):item.links).map(id=>`<button data-open="${id}">${esc(items[id].title)} <span aria-hidden="true">↗</span></button>`).join('')}${state.view==='plan'?'<button data-action="continue">＋ 接着推进</button>':''}</section><details class="meta-fold"><summary>属性与记录</summary><dl><dt>所属分组</dt><dd>${esc(item.group)}</dd><dt>数据来源</dt><dd>视觉原型示例</dd><dt>保存方式</dt><dd>仅保存在当前页面内存</dd></dl></details></article></div></aside>`;}
function toolbar(){
 const planning=state.view==='plan',title=planning?'规划':'设定';
 const graphActive=planning?!state.list:state.memoryGraph;
 return `<div class="modulebar ${state.search?'searching':''}"><h2>${title}</h2><div class="view-toggle" aria-label="${title}视图"><button data-layout="list" aria-pressed="${!graphActive}">列表</button><button data-layout="graph" aria-pressed="${graphActive}">${planning?'流程图':'关系图'}</button></div><span class="grow"></span>${state.search?`<input class="search-input" aria-label="搜索内容" placeholder="搜索标题或摘要…" value="${esc(state.query)}">`:''}<button class="icon" data-action="search" aria-label="${state.search?'关闭搜索':'搜索'}">${icon('search')}</button><button class="primary" data-action="new">${icon('plus')}${planning?'新情节':'新设定'}</button>${menu()}</div>`;
}
const newGroupButton=()=>`<button class="group-new" data-menu="groups">＋ 新建分组</button>`;
function filterControl(label,ariaLabel,options,active=false){return `<label class="filter-control ${active?'is-active':''}"><span class="filter-prefix">${label}</span><select aria-label="${ariaLabel}">${options}</select><span class="filter-chevron" aria-hidden="true"></span></label>`;}
function scopeMatches(item){
 const query=state.query.trim().toLocaleLowerCase();
 if(query&&!`${item.title} ${item.summary}`.toLocaleLowerCase().includes(query))return false;
 if(state.view==='plan')return item.type==='情节'&&(state.group==='全部分组'||(state.group==='未分组'?(!item.group||item.group==='未分组'):item.group===state.group));
 return item.type!=='情节'&&(state.type==='全部'||item.type===state.type)&&(state.memoryGroup==='all'||(state.memoryGroup==='ungrouped'?(!item.group||item.group==='未分组'):item.group===state.memoryGroup.slice(6)));
}
function memoryScope(){const count=Object.values(items).filter(scopeMatches).length;return `${filterControl('分组','设定分组',`<option value="all" ${state.memoryGroup==='all'?'selected':''}>全部分组</option><option value="ungrouped" ${state.memoryGroup==='ungrouped'?'selected':''}>未分组</option>${groups.memory.map(group=>`<option value="${esc('group:'+group)}" ${state.memoryGroup==='group:'+group?'selected':''}>${esc(group)}</option>`).join('')}`,state.memoryGroup!=='all')}${filterControl('类型','设定类型',[['全部','全部类型'],['人物','角色卡'],['世界设定','世界书']].map(([value,label])=>`<option value="${value}" ${state.type===value?'selected':''}>${label}</option>`).join(''),state.type!=='全部')}<span class="scope-count" data-result-count>${count} 条设定</span>${newGroupButton()}`;}
const emptyScope=(canvas=false)=>`<div class="scope-empty ${canvas?'canvas-empty':''}" data-scope-empty hidden><p>没有匹配的${state.view==='plan'?'情节':'设定'}</p><button data-action="clear-filters">清除筛选</button></div>`;
function planningScope(){const count=Object.values(items).filter(scopeMatches).length;return `${filterControl('分组','选择分组',['全部分组','未分组',...groups.plan].map(group=>`<option ${group===state.group?'selected':''}>${esc(group)}</option>`).join(''),state.group!=='全部分组')}<span class="scope-count" data-result-count>${count} 个情节</span>${newGroupButton()}`;}
function graph(){const scenes=Object.values(items).filter(i=>i.type==='情节');const width=Math.max(1050,...scenes.map(i=>i.x+290));const height=Math.max(610,...scenes.map(i=>i.y+210));return `<div class="canvas-wrap"><div class="canvas-scope">${planningScope()}</div><div class="canvas-scroll" aria-label="剧情画布"><div style="width:${width*state.zoom}px;height:${height*state.zoom}px"><div class="graph" style="transform:scale(${state.zoom});width:${width}px;height:${height}px"><svg class="links" aria-hidden="true" style="width:${width}px;height:${height}px"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" style="fill:#9ca99b;stroke:none"/></marker></defs>${Object.entries(items).filter(([,n])=>n.type==='情节').flatMap(([id,n])=>n.links.filter(next=>items[next]?.x!==undefined).map(next=>{const b=items[next];return `<path data-edge-from="${id}" data-edge-to="${next}" marker-end="url(#arrow)" d="M${n.x+224},${n.y+72} C${n.x+282},${n.y+72} ${b.x-46},${b.y+72} ${b.x},${b.y+72}"/>`;})).join('')}</svg>${Object.entries(items).filter(([,n])=>n.type==='情节').map(([id,n],i)=>`<button class="node" data-open="${id}" data-search="${esc(n.title+' '+n.summary)}" aria-pressed="${state.selected===id}" style="left:${n.x}px;top:${n.y}px"><div class="node-meta"><span>情节</span><span>${esc(n.status)}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p></button>`).join('')}</div></div></div>${emptyScope(true)}<div class="canvas-tools"><button data-action="zoom-out" aria-label="缩小">−</button><span>${Math.round(state.zoom*100)}%</span><button data-action="zoom-in" aria-label="放大">＋</button><button data-action="fit" aria-label="适应画布">⤢</button></div></div>`;}
function library(){const collection=Object.entries(items).filter(([,item])=>state.view==='plan'?item.type==='情节':item.type!=='情节');return `<div class="library">${state.view==='memory'?`<div class="library-heading memory-filter">${memoryScope()}</div>`:`<div class="library-heading planning-filter">${planningScope()}</div>`}${collection.map(([id,n])=>`<button class="entry" data-open="${id}" data-search="${esc(n.title+' '+n.summary)}" aria-pressed="${state.selected===id}"><span class="entry-symbol" aria-hidden="true">${n.type==='人物'?'人':n.type==='情节'?'序':'地'}</span><div><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p></div><small>${esc(n.group)}</small></button>`).join('')}${emptyScope()}</div>`;}
function memoryGraph(){
 const entries=Object.entries(items).filter(([,item])=>item.type!=='情节');
 const positions={character:{x:40,y:250},world:{x:470,y:100},oldfriend:{x:470,y:400},street:{x:900,y:100}};
 entries.filter(([id])=>!positions[id]).forEach(([id],i)=>positions[id]={x:40+(i%3)*430,y:680+Math.floor(i/3)*250});
 const width=Math.max(1164,...Object.values(positions).map(p=>p.x+264));
 const height=Math.max(640,...Object.values(positions).map(p=>p.y+200));
 const routes=memoryRelations.filter(edge=>positions[edge.from]&&positions[edge.to]).map(edge=>{
   const a=positions[edge.from],b=positions[edge.to];let path,x,y;
   if(a.x===b.x){const cx=a.x+112;const fromY=a.y>b.y?a.y:a.y+144,toY=a.y>b.y?b.y+144:b.y;path=`M${cx},${fromY} L${cx},${toY}`;x=cx;y=(fromY+toY)/2;}
   else {const fromX=a.x+224,toX=b.x;const fromY=a.y+72,toY=b.y+72;const mid=(fromX+toX)/2;path=`M${fromX},${fromY} C${mid},${fromY} ${mid},${toY} ${toX},${toY}`;x=mid;y=(fromY+toY)/2;}
   return {...edge,path,x,y};
 });
 const edgeLabel=edge=>{
   const name=edge.name.trim(),content=edge.content.trim();if(!name&&!content)return '';
   const text=`${name?`<strong>${esc(name)}</strong>`:''}${content?`<span class="relation-note">${esc(content)}</span>`:''}`;
   return `<div class="relation-label" data-relation-label="${edge.id}" data-edge-from="${edge.from}" data-edge-to="${edge.to}" style="left:${edge.x}px;top:${edge.y}px">${content.length>40?`<details><summary aria-label="展开 ${esc(items[edge.from].title)} 到 ${esc(items[edge.to].title)} 的连线说明">${text}</summary></details>`:text}</div>`;
 };
 return `<div class="canvas-wrap"><div class="canvas-scope">${memoryScope()}</div><div class="canvas-scroll" aria-label="设定关系画布"><div style="width:${width*state.memoryZoom}px;height:${height*state.memoryZoom}px"><div class="graph memory-graph" style="width:${width}px;height:${height}px;transform:scale(${state.memoryZoom})"><svg class="links" style="width:${width}px;height:${height}px" role="group" aria-label="设定连线"><defs><marker id="memory-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" style="fill:#9ca99b;stroke:none"/></marker></defs>${routes.map(edge=>`<path data-memory-edge="${edge.id}" data-edge-from="${edge.from}" data-edge-to="${edge.to}" role="img" aria-label="${esc(items[edge.from].title)} → ${esc(items[edge.to].title)}${edge.name?`：${esc(edge.name)}`:''}" marker-end="url(#memory-arrow)" d="${edge.path}"/>`).join('')}</svg>${entries.map(([id,item])=>`<button class="node" data-open="${id}" data-search="${esc(item.title+' '+item.summary)}" aria-pressed="${state.selected===id}" style="left:${positions[id].x}px;top:${positions[id].y}px"><div class="node-meta"><span>${item.type==='人物'?'角色卡':'世界书'}</span><span>${esc(item.group)}</span></div><h3>${esc(item.title)}</h3><p>${esc(item.summary)}</p></button>`).join('')}${routes.map(edgeLabel).join('')}</div></div></div>${emptyScope(true)}<div class="canvas-tools"><button data-action="memory-zoom-out" aria-label="缩小">−</button><span>${Math.round(state.memoryZoom*100)}%</span><button data-action="memory-zoom-in" aria-label="放大">＋</button><button data-action="memory-fit" aria-label="适应画布">⤢</button></div></div>`;
}
function relatedMemory(id){return [...new Set(memoryRelations.flatMap(edge=>edge.from===id?[edge.to]:edge.to===id?[edge.from]:[]))];}
const currentChapter=()=>chapters.find(chapter=>chapter.id===state.chapterId)||chapters[0];
function directoryMarkup(drawer=false){return `<aside class="directory" aria-label="章节目录"><div class="directory-heading"><h2>目录</h2><span class="grow"></span><details class="menu"><summary aria-label="新建目录内容">＋</summary><div class="menu-items"><button data-create="chapter">新建章节</button><button data-action="new-volume">新建分卷</button></div></details><button data-action="${drawer?'close-directory':'toggle-directory'}" aria-label="收起目录">${icon('back')}</button></div><input class="directory-search" aria-label="搜索章节" placeholder="查找章节…" value="${esc(state.directoryQuery)}"><div class="directory-list">${directoryList()}</div><div class="directory-foot">${chapters.length} 章 · <span data-total-count>${countLabel(chapters.map(c=>c.body).join(''))}</span></div></aside>`;}
function directoryList(){const query=state.directoryQuery.trim();const sections=[...volumes,{id:'',title:'未分卷'}];return sections.map(volume=>{const list=chapters.filter(c=>c.volumeId===volume.id&&c.title.includes(query));if((query||!volume.id)&&!list.length)return '';const folded=state.volumeCollapsed[volume.id]&&!query;return `<section class="volume-block"><div class="volume-header"><button class="volume-toggle" data-volume="${volume.id}" aria-expanded="${!folded}"><span aria-hidden="true">${folded?'▸':'▾'}</span><span>${esc(volume.title)}</span><small>${list.length} 章</small></button></div>${folded?'':list.map(c=>`<button class="chapter ${c.id===state.chapterId?'active':''}" data-chapter="${c.id}" aria-current="${c.id===state.chapterId?'page':'false'}"><span class="chapter-name">${esc(c.title)}</span><span class="chapter-count" data-count="${c.id}" title="含标点，不计空白">${countLabel(c.body)}</span></button>`).join('')||'<p class="volume-empty">还没有章节</p>'}</section>`;}).join('')||(query?'<p class="volume-empty">没有找到这个章节</p>':'');}
function manuscript(){const chapter=currentChapter();const volume=volumes.find(v=>v.id===chapter.volumeId);return `<div class="manuscript-shell">${state.directoryOpen?directoryMarkup():''}<div class="manuscript-pane"><div class="manuscript-toolbar"><button class="directory-trigger" data-action="toggle-directory" aria-label="${state.directoryOpen&&!matchMedia('(max-width:760px)').matches?'收起章节目录':'展开章节目录'}" aria-expanded="${state.directoryOpen&&!matchMedia('(max-width:760px)').matches}">☰ 目录</button><small class="chapter-path">${esc(volume?.title||'未分卷')}</small><span class="grow"></span><button data-action="format-manuscript">自动排版</button><button data-action="manuscript-edit">${state.editing?'完成':'编辑'}</button></div><div class="manuscript-view"><article><span class="chapter-eyebrow">${esc(volume?.title||'未分卷')}</span>${state.editing?`<input class="chapter-title" aria-label="章节标题" value="${esc(chapter.title)}"><textarea aria-label="示例正文" class="edit-body" placeholder="从第一句话开始…">${esc(chapter.body)}</textarea>`:`<h1>${esc(chapter.title)}</h1>${chapter.body?textBody(chapter.body):'<p class="empty-prose">这一章还没有正文。</p><button class="primary" data-action="manuscript-edit">开始写作</button>'}`}</article></div><footer class="statusline"><span data-current-count title="含标点，不计空白">${countLabel(chapter.body)}</span><span>仅保存在本次预览</span></footer></div></div>`;}
const createConfig={chapter:{name:'章节',title:'章节标题',placeholder:'这一章叫什么？',body:'从第一句话开始…',submit:'创建章节'},plan:{name:'情节',title:'情节标题',placeholder:'这里将发生什么？',body:'自由写下推进过程、人物选择，或还想讨论的问题…',submit:'创建情节'},character:{name:'角色',title:'角色名称',placeholder:'角色的名字',body:'写下这个人物的经历、动机与关系…',submit:'创建角色'},world:{name:'世界书条目',title:'条目名称',placeholder:'地点、规则，或一项设定',body:'自由补充这条设定的完整内容…',submit:'创建条目'}};
function creationPage(){const draft=state.creating,cfg=createConfig[draft.kind];const isChapter=draft.kind==='chapter';const memory=['character','world'].includes(draft.kind);const choices=isChapter?volumes.map(v=>({value:v.id,label:v.title})):(groups[draft.kind==='plan'?'plan':'memory']).map(g=>({value:g,label:g}));return `<main class="creation" aria-label="新建${cfg.name}"><div class="creation-bar"><button data-action="cancel-create">${icon('back')}取消</button><span class="creation-label">新建${cfg.name}</span><span class="grow"></span><button class="primary" data-action="submit-create">${cfg.submit}</button></div><div class="creation-scroll"><form class="creation-document" id="creation-form">${memory?`<div class="creation-type" aria-label="设定类型"><button type="button" data-create-type="character" aria-pressed="${draft.kind==='character'}">角色卡</button><button type="button" data-create-type="world" aria-pressed="${draft.kind==='world'}">世界书</button></div>`:''}${draft.from?`<p class="creation-context">接在「${esc(items[draft.from].title)}」之后<br><span class="muted">创建后自动连接，取消不会留下空节点。</span></p>`:''}<div class="creation-settings"><label for="create-group">${isChapter?'放入':'分组'}</label><select id="create-group"><option value="">${isChapter?'未分卷':'未分组'}</option>${choices.map(g=>`<option value="${esc(g.value)}" ${g.value===draft.group?'selected':''}>${esc(g.label)}</option>`).join('')}</select><button type="button" data-action="create-container">＋ ${isChapter?'新建分卷':'新建分组'}</button></div><label for="create-title">${cfg.title}</label><input id="create-title" autocomplete="off" required aria-describedby="create-error" placeholder="${cfg.placeholder}" value="${esc(draft.title)}"><p id="create-error" class="field-error" role="alert" hidden>请填写${cfg.title}</p>${!isChapter?`<label for="create-summary">摘要<span class="optional">可稍后补充</span></label><textarea id="create-summary" rows="2" placeholder="用一两句话，方便你和 AI 查找这条内容。">${esc(draft.summary)}</textarea>`:''}<label for="create-body">${isChapter?'正文':'完整内容'}<span class="optional">可稍后补充</span></label><textarea id="create-body" placeholder="${cfg.body}">${esc(draft.body)}</textarea><p class="creation-footer">${isChapter?'可以只写标题，创建后继续写正文。':'只需一个标题即可创建，内容结构由你安排。'}</p></form></div></main>`;}
function render(focus=false){document.getElementById('app').innerHTML=`<header class="appbar"><div class="brand"><span class="mark" aria-hidden="true"></span>示例作品 <small>催更姬</small></div><nav class="tabs" aria-label="主导航">${[['chapter','正文'],['plan','规划'],['memory','设定']].map(([id,name])=>`<button data-view="${id}" aria-pressed="${state.view===id}">${name}</button>`).join('')}</nav><span class="grow"></span><div class="app-actions"><button data-action="preferences" aria-label="设置">${icon('settings')}<span>设置</span></button><button data-action="about" aria-label="关于催更姬">${icon('info')}<span>关于</span></button></div></header>${state.view==='chapter'?manuscript():`<main class="workspace ${state.selected?'has-detail':''}"><section class="overview">${toolbar()}${state.view==='plan'&&!state.list?graph():state.view==='memory'&&state.memoryGraph?memoryGraph():library()}</section>${detail()}</main>`}`;
 const groupSelect=document.querySelector('[aria-label="选择分组"]');if(groupSelect)groupSelect.onchange=()=>{state.group=groupSelect.value;state.recenterScope=true;render();};
 const memoryGroupSelect=document.querySelector('[aria-label="设定分组"]');if(memoryGroupSelect)memoryGroupSelect.onchange=()=>{state.memoryGroup=memoryGroupSelect.value;state.recenterScope=true;render();document.querySelector('[aria-label="设定分组"]')?.focus();};
 const memoryTypeSelect=document.querySelector('[aria-label="设定类型"]');if(memoryTypeSelect)memoryTypeSelect.onchange=()=>{state.type=memoryTypeSelect.value;state.recenterScope=true;render();document.querySelector('[aria-label="设定类型"]')?.focus();};
 const search=document.querySelector('.search-input');if(search){search.oninput=()=>{state.query=search.value;state.recenterScope=true;filter();};}
 if(state.creating){document.querySelector('.workspace,.manuscript-shell')?.remove();document.getElementById('app').insertAdjacentHTML('beforeend',creationPage());document.getElementById('creation-form').onsubmit=e=>{e.preventDefault();submitCreation();};document.querySelectorAll('.creation input,.creation textarea,.creation select').forEach(el=>el.addEventListener('input',()=>{captureCreation();if(el.id==='create-group')state.creating.groupTouched=true;if(el.id==='create-title'){el.removeAttribute('aria-invalid');document.getElementById('create-error').hidden=true;}}));}
 setupAutoGrow();bindDirectorySearch();bindManuscript();
 filter();if(focus)document.querySelector('.creation #create-title,.detail h1,.detail #edit-title')?.focus();
 const scroller=document.querySelector('.canvas-scroll');if(scroller){let drag;scroller.onpointerdown=e=>{if(e.target.closest('button,.relation-label'))return;drag={x:e.clientX,y:e.clientY,left:scroller.scrollLeft,top:scroller.scrollTop};scroller.setPointerCapture(e.pointerId);scroller.classList.add('dragging');};scroller.onpointermove=e=>{if(drag){scroller.scrollLeft=drag.left+drag.x-e.clientX;scroller.scrollTop=drag.top+drag.y-e.clientY;}};scroller.onpointerup=scroller.onpointercancel=()=>{drag=null;scroller.classList.remove('dragging');};}}
function filter(){let count=0;document.querySelectorAll('[data-search]').forEach(el=>{el.hidden=!scopeMatches(items[el.dataset.open]);if(!el.hidden)count++;});document.querySelectorAll('[data-result-count]').forEach(el=>el.textContent=`${count} ${state.view==='plan'?'个情节':'条设定'}`);document.querySelectorAll('[data-scope-empty]').forEach(el=>el.hidden=count>0);document.querySelectorAll('[data-edge-from]').forEach(edge=>{const from=document.querySelector(`.node[data-open="${edge.dataset.edgeFrom}"]`),to=document.querySelector(`.node[data-open="${edge.dataset.edgeTo}"]`);edge.style.display=!from||!to||from.hidden||to.hidden?'none':'';});if(state.recenterScope){const canvas=document.querySelector('.canvas-scroll');const nodes=[...document.querySelectorAll('.graph .node')].filter(el=>!el.hidden);if(canvas&&nodes.length){const zoom=state.view==='plan'?state.zoom:state.memoryZoom;canvas.scrollLeft=Math.max(0,Math.min(...nodes.map(el=>el.offsetLeft))*zoom-32);canvas.scrollTop=Math.max(0,Math.min(...nodes.map(el=>el.offsetTop))*zoom-100);}state.recenterScope=false;}}
function modal(title,content,onSubmit){const dialog=document.getElementById('dialog');dialog.className='';dialog.oncancel=null;dialog.removeAttribute('aria-labelledby');dialog.setAttribute('aria-label',title);dialog.returnValue='';dialog.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2>${content}<div class="actions"><button value="cancel">关闭</button>${onSubmit?'<button class="primary" value="confirm">确定</button>':''}</div></form>`;dialog.onclose=()=>{if(dialog.returnValue==='confirm'&&onSubmit)onSubmit(dialog.querySelector('input')?.value||'');};dialog.showModal();}
function setupAutoGrow(){document.querySelectorAll('textarea').forEach(el=>{const grow=()=>{const viewport=el.closest('.creation-scroll,.detail-scroll,.manuscript-view');const top=viewport?.scrollTop||0;el.style.height='0px';el.style.height=Math.max(50,el.scrollHeight)+'px';if(viewport)viewport.scrollTop=top;};grow();el.oninput=grow;});}

function refreshCounts(){const chapter=currentChapter();document.querySelectorAll(`[data-count="${chapter.id}"]`).forEach(el=>el.textContent=countLabel(chapter.body));document.querySelectorAll('[data-total-count]').forEach(el=>el.textContent=countLabel(chapters.map(c=>c.body).join('')));const footer=document.querySelector('[data-current-count]');if(footer)footer.textContent=countLabel(chapter.body);}
function bindManuscript(){const input=document.querySelector('.manuscript-view textarea');if(input)input.addEventListener('input',()=>{currentChapter().body=input.value;refreshCounts();});const title=document.querySelector('.chapter-title');if(title)title.addEventListener('input',()=>{currentChapter().title=title.value;document.querySelectorAll(`[data-chapter="${currentChapter().id}"] .chapter-name`).forEach(el=>el.textContent=title.value);});}
function closeDialog(){const dialog=document.getElementById('dialog');if(dialog.open)dialog.close();}

function toggleDirectory(){if(matchMedia('(max-width:760px)').matches){openDirectory();return;}const top=document.querySelector('.manuscript-view')?.scrollTop||0;state.directoryOpen=!state.directoryOpen;render();document.querySelector('.manuscript-view').scrollTop=top;document.querySelector('.directory-trigger')?.focus();}
function captureCreation(){const draft=state.creating;if(!draft)return;draft.title=document.getElementById('create-title')?.value??draft.title;draft.summary=document.getElementById('create-summary')?.value??draft.summary;draft.body=document.getElementById('create-body')?.value??draft.body;draft.group=document.getElementById('create-group')?.value??draft.group;}
function startCreation(kind,from=null){closeDialog();if(state.creationDraft?.kind===kind&&state.creationDraft?.from===from){state.creating=state.creationDraft;state.creationDraft=null;render(true);return;}state.creating={kind,from,title:'',summary:'',body:'',groupTouched:['character','world'].includes(kind)&&state.memoryGroup!=='all',group:from?items[from].group:kind==='chapter'?currentChapter().volumeId:kind==='plan'?['全部分组','未分组'].includes(state.group)?'':state.group:state.memoryGroup==='ungrouped'?'':state.memoryGroup.startsWith('group:')?state.memoryGroup.slice(6):kind==='world'?'地点与风俗':'城中人物'};render(true);}

function submitCreation(){captureCreation();const draft=state.creating;if(!draft)return;const title=document.getElementById('create-title');if(!draft.title.trim()){title.setAttribute('aria-invalid','true');document.getElementById('create-error').hidden=false;title.focus();return;}const id=uid(draft.kind);if(draft.kind==='chapter'){chapters.push({id,title:draft.title.trim(),body:draft.body,volumeId:draft.group});state.chapterId=id;state.view='chapter';state.editing=true;state.volumeCollapsed[draft.group]=false;}else{const plan=draft.kind==='plan';const index=Object.values(items).filter(i=>i.type==='情节').length;items[id]={type:plan?'情节':draft.kind==='world'?'世界设定':'人物',title:draft.title.trim(),summary:draft.summary,body:draft.body,group:draft.group||'未分组',status:plan?'讨论中':'',links:[],...(plan?{x:680+Math.floor((index-3)/2)*314,y:index%2===0?366:92}:{})};if(draft.from)items[draft.from].links.push(id);state.view=plan?'plan':'memory';state.selected=id;state.type='全部';state.editing=false;if(plan)state.group=draft.group||'未分组';else state.memoryGroup=draft.group?'group:'+draft.group:'ungrouped';}state.query='';state.search=false;state.creating=null;state.creationDraft=null;render(true);document.querySelector('.manuscript-view textarea')?.focus();}
function nameDialog(kind,onDone){captureCreation();const wasDrawer=document.getElementById('dialog').classList.contains('directory-modal')&&document.getElementById('dialog').open;closeDialog();const dialog=document.getElementById('dialog');const volume=kind==='volume';const label=volume?'分卷':'分组';const title=volume?'新建分卷':'新建分组';dialog.className='compact-modal';dialog.removeAttribute('aria-label');dialog.setAttribute('aria-labelledby','container-heading');dialog.oncancel=event=>{if(wasDrawer){event.preventDefault();closeDialog();openDirectory();}};dialog.innerHTML=`<form id="name-form" novalidate><div class="modal-head"><h2 id="container-heading">${title}</h2><span class="grow"></span><button type="button" data-dismiss-name aria-label="关闭">×</button></div><div class="modal-body"><p>${volume?'把一段故事的章节收在一起。':'把相关内容放在一起，方便下次查找。'}</p><label for="container-name">${label}名称</label><input id="container-name" placeholder="${volume?'例如：第三卷 · 重逢':'例如：城北人物、旧城线索'}" autocomplete="off" aria-describedby="container-error"><p class="modal-error" id="container-error" role="alert" hidden></p></div><div class="actions"><button type="button" data-dismiss-name>取消</button><button class="primary" type="submit">创建${label}</button></div></form>`;
 const trigger=document.activeElement;dialog.onclose=()=>{if(!dialog.open&&trigger?.isConnected)trigger.focus();};dialog.querySelectorAll('[data-dismiss-name]').forEach(el=>el.onclick=()=>{closeDialog();if(wasDrawer)openDirectory();});dialog.querySelector('form').onsubmit=event=>{event.preventDefault();const input=dialog.querySelector('input'),name=input.value.trim();const scope=state.creating?.kind==='plan'||(!state.creating&&state.view==='plan')?'plan':'memory';const existing=volume?volumes.map(v=>v.title):groups[scope];if(!name||existing.includes(name)){const error=dialog.querySelector('.modal-error');error.textContent=!name?`请填写${label}名称`:`已有同名${label}，换一个名称吧`;error.hidden=false;input.setAttribute('aria-invalid','true');input.focus();return;}const value=volume?uid('volume'):name;if(volume)volumes.push({id:value,title:name});else groups[scope].push(name);closeDialog();if(onDone)onDone(value);else{state.directoryOpen=true;render();if(wasDrawer)openDirectory();}};dialog.showModal();dialog.querySelector('input').focus();}
function utilityDialog(title,body,footer=''){const opener=document.activeElement;const dialog=document.getElementById('dialog');closeDialog();dialog.className='utility-modal';dialog.removeAttribute('aria-label');dialog.setAttribute('aria-labelledby','utility-title');dialog.oncancel=null;dialog.onclose=()=>{if(!dialog.open&&opener?.isConnected)opener.focus();};dialog.innerHTML=`<header class="utility-head"><h2 id="utility-title">${title}</h2><button aria-label="关闭${title}" data-utility-close>×</button></header><div class="utility-content">${body}</div>${footer?`<footer class="utility-footer">${footer}</footer>`:''}`;dialog.querySelector('[data-utility-close]').onclick=closeDialog;dialog.showModal();return dialog;}
const preferenceSelect=(key,label,options)=>`<select class="preference-select" data-preference="${key}" aria-label="${label}">${options.map(([value,text])=>`<option value="${value}" ${preferences[key]===value?'selected':''}>${text}</option>`).join('')}</select>`;
function openPreferences(){
 const dialog=utilityDialog('设置',`<section class="preference-section"><h3>阅读与编辑</h3><div class="reading-controls"><label><span>正文字号</span>${preferenceSelect('fontSize','正文字号',[['16','16 px'],['18','18 px'],['20','20 px'],['22','22 px']])}</label><label><span>段落行距</span>${preferenceSelect('lineHeight','段落行距',[['1.75','紧凑'],['1.95','适中'],['2.2','宽松']])}</label></div><div class="reading-preview" aria-label="正文效果预览"><small>效果预览</small><p>雨声把敲门声压得很低。沈砚搁下笔，等了一会儿，门外又响了两下。</p></div></section><section class="preference-section"><h3>工作台习惯</h3><p class="section-hint">下次进入对应模块时使用。</p><label class="preference-row"><span>默认展开章节目录</span><input class="preference-switch" type="checkbox" data-preference="directoryOpen" ${preferences.directoryOpen?'checked':''}></label><label class="preference-row"><span>规划默认视图</span>${preferenceSelect('planningView','规划默认视图',[['graph','流程图'],['list','列表']])}</label><label class="preference-row"><span>设定默认视图</span>${preferenceSelect('settingsView','设定默认视图',[['list','列表'],['graph','关系图']])}</label></section><section class="preference-section"><h3>交互</h3><label class="preference-row"><span>动态效果</span>${preferenceSelect('motion','动态效果',[['system','跟随系统'],['reduce','减少动态效果']])}</label></section>`,`<button class="reset-preferences">恢复默认</button><span data-preference-status>仅保存界面偏好，不影响作品内容</span>`);
 dialog.querySelectorAll('[data-preference]').forEach(input=>{input.onchange=()=>{preferences[input.dataset.preference]=input.type==='checkbox'?input.checked:input.value;savePreferences();};});
 dialog.querySelector('.reset-preferences').onclick=()=>{Object.assign(preferences,preferenceDefaults);dialog.querySelectorAll('[data-preference]').forEach(input=>{if(input.type==='checkbox')input.checked=preferences[input.dataset.preference];else input.value=preferences[input.dataset.preference];});savePreferences();};
}
function openAbout(){const dialog=utilityDialog('关于催更姬',`<div class="about-identity"><span class="mark" aria-hidden="true"></span><div><h3>催更姬</h3><p>cuigengji · 小说写作工作台</p></div></div><p class="about-intro">为作者与 AI 写作助手整理正文、情节规划，以及人物与世界设定。</p><dl class="about-capabilities"><div><dt>正文</dt><dd>章节与分卷，专注写作。</dd></div><div><dt>规划</dt><dd>用情节流程图讨论下一步。</dd></div><div><dt>设定</dt><dd>按分组查找人物、世界书与关系。</dd></div></dl><section class="about-preview"><h3>交互原型 <span>2026.09.30</span></h3><p>当前使用示例内容，不连接正式作品。编辑仅保留在当前页面，刷新会还原；界面偏好单独保存在此浏览器。</p></section>`,`<a class="project-link" href="https://github.com/mistnest/dsh-cuigengji-plugin" target="_blank" rel="noopener noreferrer">项目仓库 <span aria-hidden="true">↗</span></a>`);dialog.classList.add('about-modal');}
function newItem(from){startCreation(state.view==='plan'?'plan':state.type==='世界设定'?'world':'character',from);}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.layout){if(state.view==='plan')state.list=button.dataset.layout==='list';else{state.memoryGraph=button.dataset.layout==='graph';}state.selected=null;state.editing=false;state.recenterScope=true;render();document.querySelector(`[data-layout="${button.dataset.layout}"]`)?.focus();return;}
 if(button.dataset.create){startCreation(button.dataset.create);return;}
 if(button.dataset.createType){captureCreation();state.creating.kind=button.dataset.createType;if(!state.creating.groupTouched)state.creating.group=button.dataset.createType==='world'?'地点与风俗':'城中人物';render(true);return;}
 if(button.dataset.chapter){state.chapterId=button.dataset.chapter;state.editing=false;closeDialog();render();document.querySelector('.manuscript-view h1')?.setAttribute('tabindex','-1');document.querySelector('.manuscript-view h1')?.focus();return;}
 if(button.hasAttribute('data-volume')){state.volumeCollapsed[button.dataset.volume]=!state.volumeCollapsed[button.dataset.volume];document.querySelectorAll('.directory-list').forEach(el=>el.innerHTML=directoryList());document.querySelector(`[data-volume="${button.dataset.volume}"]`)?.focus();return;}
 if(button.dataset.view){if(state.creating){captureCreation();state.creationDraft=state.creating;state.creating=null;}state.view=button.dataset.view;if(state.view==='plan')state.list=preferences.planningView==='list';if(state.view==='memory')state.memoryGraph=preferences.settingsView==='graph';if(state.view==='chapter')state.directoryOpen=preferences.directoryOpen;state.selected=null;state.editing=false;state.search=false;state.query='';render();return;}
 if(button.dataset.open){state.selected=button.dataset.open;state.editing=false;render(true);return;}
 if(button.dataset.type){state.type=button.dataset.type;render();return;}
 const action=button.dataset.action;
 if(action==='preferences'){openPreferences();return;}
 if(action==='about'){openAbout();return;}
 if(action==='clear-filters'){state.query='';state.search=false;if(state.view==='plan')state.group='全部分组';else{state.memoryGroup='all';state.type='全部';}state.recenterScope=true;render();return;}
 if(action==='toggle-directory'){toggleDirectory();return;}
 if(action==='close-directory'){closeDialog();return;}
 if(action==='new-volume'){nameDialog('volume');return;}
 if(action==='cancel-create'){cancelCreation();return;}
 if(action==='submit-create'){submitCreation();return;}
 if(action==='create-container'){const kind=state.creating.kind==='chapter'?'volume':'group';nameDialog(kind,value=>{state.creating.group=value;state.creating.groupTouched=true;render();document.getElementById('create-group')?.focus();});return;}
 if(action==='format-manuscript'){currentChapter().body=currentChapter().body.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>'　　'+line).join('\n\n');render();return;}
 if(action==='back'){const old=state.selected;state.selected=null;state.editing=false;render();document.querySelector(`[data-open="${old}"]`)?.focus();}
 if(action==='edit'){state.editing=true;render(true);}
 if(action==='cancel'){state.editing=false;render(true);}
 if(action==='save'){const title=document.getElementById('edit-title');if(!title.value.trim()){title.focus();return;}Object.assign(items[state.selected],{title:title.value,summary:document.getElementById('edit-summary').value,body:document.getElementById('edit-body').value});state.editing=false;render(true);}
 if(action==='search'){state.search=!state.search;state.query='';render();document.querySelector('.search-input')?.focus();}
 if(action==='continue')newItem(state.selected);
 if(action==='new')newItem(null);
 if(action==='properties'){const fold=document.querySelector('.meta-fold');fold.open=true;fold.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'nearest'});}
 if(action==='memory-zoom-in'||action==='memory-zoom-out'){state.memoryZoom=Math.max(.5,Math.min(1.5,state.memoryZoom+(action==='memory-zoom-in'?.1:-.1)));render();return;}
 if(action==='memory-fit'){state.memoryZoom=Math.max(.5,Math.min(1,document.querySelector('.canvas-scroll').clientWidth/document.querySelector('.memory-graph').offsetWidth));render();return;}
 if(action==='zoom-in'||action==='zoom-out'){state.zoom=Math.max(.4,Math.min(1.5,state.zoom+(action==='zoom-in'?.1:-.1)));render();}
 if(action==='fit'){state.zoom=Math.max(.4,Math.min(1,document.querySelector('.canvas-scroll').clientWidth/1050));render();}
 if(action==='manuscript-edit'){state.editing=!state.editing;render();}
 if(button.dataset.menu==='groups')nameDialog('group',value=>{if(state.view==='plan')state.group=value;else state.memoryGroup='group:'+value;state.query='';state.search=false;state.recenterScope=true;render();});
 if(button.dataset.menu==='history')modal('修改记录','<p>此处将显示可比较、可撤销的版本记录。</p><p class="muted">原型仅演示入口与浮层，没有接入小说版本数据。</p>');
 button.closest('details.menu')?.removeAttribute('open');
});
document.addEventListener('pointerdown',event=>document.querySelectorAll('details.menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false;}));
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const menus=[...document.querySelectorAll('details.menu[open]')];menus.forEach(menu=>{menu.open=false;menu.querySelector('summary').focus();});}});
let resizeFrame;window.addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{setupAutoGrow();if(document.querySelector('.canvas-scroll')){state.recenterScope=true;filter();}const trigger=document.querySelector('.directory-trigger');if(trigger){const expanded=state.directoryOpen&&!matchMedia('(max-width:760px)').matches;trigger.setAttribute('aria-expanded',String(expanded));trigger.setAttribute('aria-label',expanded?'收起章节目录':'展开章节目录');}});});
applyPreferences();
render();
</script>
</html>
